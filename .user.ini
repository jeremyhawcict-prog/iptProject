; MediQueue — PHP settings for CGI/FastCGI hosts (ByetHost)
; This file replaces the php_value/php_flag directives that were in .htaccess.
; ByetHost reads .user.ini automatically.

display_errors = Off
log_errors = On

session.cookie_httponly = 1
session.use_strict_mode = 1
session.cookie_samesite = Lax

upload_max_filesize = 2M
post_max_size = 3M
